# WAHA (WhatsApp HTTP API) + smart-ledger-agent.
#
# Jalanankan WAHA saja (app dijalankan lokal untuk dev):
#   docker compose up -d
#
# Jalankan SEMUA (WAHA + app) dalam container:
#   docker compose --profile app up -d
#
# Set di .env sebelum up:
#   WAHA_API_KEY, WAHA_WEBHOOK_TOKEN, OPENROUTER_API_KEY

services:
  # ───────────────────────────────────────────────────────────
  # PostgreSQL - basis data utama (Rev. D)
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smart-ledger-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_ledger}
      TZ: Asia/Jakarta
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────────────────────────────────────────────────────────
  # WAHA - WhatsApp HTTP API
  # ───────────────────────────────────────────────────────────
  waha:
    # Tag spesifik arm64 + engine NOWEB (Apple Silicon).
    # Untuk amd64 ganti: devlikeapro/waha:noweb
    image: devlikeapro/waha:noweb-arm
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Engine ringan tanpa Chromium (cocok untuk personal/M1).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Mulai session "default" otomatis saat boot.
      WHATSAPP_START_SESSION: default
      WAHA_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "True"
      WAHA_WORKER_ID: waha1
      TZ: Asia/Jakarta
      # Auth API + dashboard.
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      # Global webhook ke app yang jalan di host (bukan di container).
      WHATSAPP_HOOK_URL: http://host.docker.internal:8080/webhook?token=${WAHA_WEBHOOK_TOKEN}
      WHATSAPP_HOOK_EVENTS: message
    # Agar host.docker.internal resolve di semua platform (Mac/Win/Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sessions:/app/.sessions

  # ───────────────────────────────────────────────────────────
  # smart-ledger-agent (opsional, via profile "app")
  # ───────────────────────────────────────────────────────────
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-ledger-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      waha:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_DSN: host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-smart_ledger} port=5432 sslmode=disable timezone=Asia/Jakarta
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: default
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat}
